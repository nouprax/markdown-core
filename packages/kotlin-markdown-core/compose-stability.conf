// Compose compiler stability configuration for the Markdown Core AST.
//
// Every type below is an immutable value: a node never changes after a parse,
// its collections are read-only, `equals` is deep value equality including the
// node's id, and `hashCode` reads the id. The Compose compiler cannot infer
// this for classes from a module it did not compile, so a consumer adds this
// file to its own build:
//
//     composeCompiler {
//         stabilityConfigurationFiles.add(layout.projectDirectory.file("compose-stability.conf"))
//     }

