[package]
name = "markdown-core-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
honggfuzz = "0.5"

[dependencies.markdown-core]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "libfuzz"
path = "cases/libfuzz.rs"
test = false
doc = false

[[bin]]
name = "hfuzz"
path = "cases/hfuzz.rs"
test = false
doc = false
