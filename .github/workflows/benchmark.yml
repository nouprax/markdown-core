name: Benchmark

# Performance workloads are scheduled independently of correctness CI: they
# never run as part of pull-request or push checks, and pnpm test / the
# correctness CTest preset never includes them.

on:
    schedule:
        - cron: "17 4 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    benchmark:
        runs-on: ubuntu-latest
        env:
            CC: clang
            CXX: clang++
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Configure
              run: cmake --preset default
            - name: Build
              run: cmake --build --preset default --parallel
            - name: Run benchmark workloads (benchmark preset)
              run: ctest --preset benchmark
            - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
              with:
                  cache: gradle
                  distribution: temurin
                  java-version: 26
            - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
            - name: Install Android platform
              run: sdkmanager "platforms;android-36"
            - name: Run Kotlin benchmark workloads
              run: scripts/gradle.sh :packages:kotlin-markdown-core:kotlinBenchmark
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  run_install: false
                  version: 11.7.0
            - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
              with:
                  version: 4.0.23
            - name: Run ES/WASM benchmark workloads
              run: pnpm benchmark:es-node

    swift-benchmark:
        runs-on: macos-26
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: "26.6"
            - name: Run Swift native-copy benchmark workload
              run: swift run -c release MarkdownCoreBenchmarks
