name: Benchmark

# What a parse costs Markdown Core, stage by stage, next to what the same bytes
# cost cmark. Callgrind counts instructions and data references rather than
# time, so a shared runner's load and speed cannot reach the result and this one
# is worth reading; the pipeline this replaced measured wall clock on that same
# runner and could only ever be informational.
#
# Not the same as machine-independent. The counts depend on the compiler, the C
# library, what the C library dispatched on, and the corpus, all of which the
# report records in an identity table. Toolchain and measurement inputs must
# match; source/object inventories are provenance that may change in a refactor.
# What this job produces is comparable
# to another run of this job, not to whatever a contributor ran locally.
#
# CI calls this workflow only when its shared preflight requires execution.
# Both measurements contribute to Required gates. Manual runs always measure.
# The CI completion publisher reads bounded JSON artifacts and updates one PR
# comment; only that trusted default-branch publisher has write permissions.

on:
    workflow_call:
    workflow_dispatch:

permissions:
    actions: read
    contents: read

concurrency:
    group: benchmark-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    stages:
        name: Measure - parse stages against cmark
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.8.1
            - name: Install callgrind
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends --yes valgrind
            - name: Build the pinned reference checkouts
              run: scripts/tooling/setup-environment.sh --install oracle-cmark oracle-cmark-gfm
            - name: Measure every engine and compare source-stage regressions
              env:
                  BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
              run: |
                  if [ -z "$BASE_REVISION" ] || [ "$BASE_REVISION" = 0000000000000000000000000000000000000000 ]; then
                      BASE_REVISION=$(git rev-parse HEAD^)
                  fi
                  node scripts/benchmark/run.mjs --out build/benchmark-grammar --baseline-ref "$BASE_REVISION"
            - name: Upload structured results for the PR comment
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: benchmark-report-stages-${{ github.run_attempt }}
                  path: |
                      build/benchmark-grammar/stages.json
                      build/benchmark-grammar/baseline/stages.json
                  if-no-files-found: warn
                  retention-days: 30
            - name: Upload the report and the raw dumps
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: benchmark-${{ github.sha }}-${{ github.run_attempt }}
                  # The dumps are what a reviewer opens in kcachegrind when a
                  # stage total moves and the table does not say why, and the
                  # corpus is what they diff when the report's corpus digest
                  # moves instead -- the digest says two reports measured
                  # different documents, these say which ones.
                  path: |
                      build/benchmark-grammar/stages.md
                      build/benchmark-grammar/stages.json
                      build/benchmark-grammar/callgrind
                      build/benchmark-grammar/corpus
                      build/benchmark-grammar/baseline/stages.md
                      build/benchmark-grammar/baseline/stages.json
                      build/benchmark-grammar/baseline/callgrind
                      build/benchmark-grammar/baseline/corpus
                  if-no-files-found: error
                  retention-days: 30

    attributes:
        name: Measure - the attribute grammar against lexbor
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.8.1
            - name: Install callgrind
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends --yes valgrind
            - name: Build the pinned lexbor baseline
              run: scripts/tooling/setup-environment.sh --install oracle-lexbor
            # A separate job from the stage measurement, for the same reason it
            # is a separate driver: the two baselines cannot be given the same
            # bytes, so this compares one grammar against one grammar rather
            # than two document parsers on one corpus.
            - name: Measure the attribute grammar
              run: node scripts/benchmark/measure-attributes.mjs
            - name: Upload structured results for the PR comment
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: benchmark-report-attributes-${{ github.run_attempt }}
                  path: build/benchmark-attributes/attributes.json
                  if-no-files-found: warn
                  retention-days: 30
            - name: Upload the report and the raw dumps
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: benchmark-attributes-${{ github.sha }}-${{ github.run_attempt }}
                  path: |
                      build/benchmark-attributes/attributes.md
                      build/benchmark-attributes/attributes.json
                      build/benchmark-attributes/callgrind
                      build/benchmark-attributes/input
                  if-no-files-found: error
                  retention-days: 30

    # The grammar corpus's workloads: every feature under every edit and
    # stream family it runs. They take hours of callgrind on one runner, so
    # each shard measures the workloads at positions shard, shard + N, ...
    # of the set on its own runner, and the job below joins the parts. The
    # shapes are measured at their four sizes together, outside this workflow.
    edit-shards:
        name: Measure - edits and streams, part ${{ matrix.shard }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [0, 1, 2, 3, 4, 5, 6, 7]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.8.1
            - name: Install callgrind
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends --yes valgrind
            # The edit benchmark is built by the stage benchmark's own build,
            # references included, so its binaries are the ones that report
            # describes.
            - name: Build the pinned reference checkouts
              run: scripts/tooling/setup-environment.sh --install oracle-cmark oracle-cmark-gfm
            - name: Measure this part of the edits and streams
              run: >-
                  node scripts/benchmark/edits.mjs --set corpus --quiet
                  --shard "${{ strategy.job-index }}/${{ strategy.job-total }}"
            - name: Upload this part for the join
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: benchmark-edits-part-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
                  path: build/benchmark-edits/edits.json
                  if-no-files-found: error
                  retention-days: 30
            - name: Upload the raw profiles and workloads
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: benchmark-edits-profiles-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
                  path: |
                      build/benchmark-edits/callgrind
                      build/benchmark-edits/workloads
                  if-no-files-found: error
                  retention-days: 30

    edits:
        name: Measure - edits and streams
        needs: edit-shards
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.8.1
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: benchmark-edits-part-*-${{ github.sha }}-${{ github.run_attempt }}
                  path: build/benchmark-edit-parts
            - name: Join the parts into one report
              run: node scripts/benchmark/edits.mjs --merge build/benchmark-edit-parts --quiet
            - name: Upload structured results for the PR comment
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: benchmark-report-edits-${{ github.run_attempt }}
                  path: build/benchmark-edits/edits.json
                  if-no-files-found: warn
                  retention-days: 30
            - name: Upload the report
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: benchmark-edits-${{ github.sha }}-${{ github.run_attempt }}
                  path: |
                      build/benchmark-edits/edits.md
                      build/benchmark-edits/edits.json
                  if-no-files-found: error
                  retention-days: 30
