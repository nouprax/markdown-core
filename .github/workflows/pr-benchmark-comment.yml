name: PR Benchmark Comment

on:
    workflow_run:
        workflows: [PR Benchmark]
        types: [completed]

permissions:
    actions: read
    contents: read
    pull-requests: write

jobs:
    comment:
        name: Report - Paired PR benchmark
        if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out the trusted reporter at its workflow revision
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.workflow_sha }}
                  path: reporter
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.8.1
            - name: Validate run and artifact provenance
              id: comparison
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const { pathToFileURL } = require("node:url");
                      const module = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/reporter/scripts/pr-benchmark-comment.mjs`));
                      const expected = await module.resolveComparison({ github, context, core });
                      if (expected) {
                          core.setOutput("expected", JSON.stringify(expected));
                          core.setOutput("current", "true");
                      }
            - name: Download the bounded comparison as data
              if: ${{ steps.comparison.outputs.current == 'true' }}
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ github.event.workflow_run.id }}
                  name: pr-benchmark-comparison-${{ github.event.workflow_run.run_attempt }}
                  path: benchmark-data
            - name: Validate both revisions and update the comment
              if: ${{ steps.comparison.outputs.current == 'true' }}
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  EXPECTED_COMPARISON: ${{ steps.comparison.outputs.expected }}
              with:
                  script: |
                      const { pathToFileURL } = require("node:url");
                      const module = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/reporter/scripts/pr-benchmark-comment.mjs`));
                      await module.publishComparison({
                          github, context, core,
                          expected: JSON.parse(process.env.EXPECTED_COMPARISON),
                          file: "benchmark-data/comparison.json",
                      });
