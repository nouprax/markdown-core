name: PR Benchmark Comment

on:
    workflow_run:
        workflows: [PR Benchmark]
        types: [completed]

permissions:
    actions: read
    contents: read
    issues: write
    pull-requests: write

jobs:
    comment:
        name: Report - PR benchmark comparison
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        runs-on: ubuntu-latest
        steps:
            - name: Resolve the pull request and validate artifact metadata
              id: comparison
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const run = context.payload.workflow_run;
                      const artifacts = await github.paginate(
                          github.rest.actions.listWorkflowRunArtifacts,
                          {
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              run_id: run.id,
                              per_page: 100,
                          },
                      );
                      let pullRequests = run.pull_requests ?? [];
                      if (pullRequests.length !== 1) {
                          const associated =
                              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                                  owner: context.repo.owner,
                                  repo: context.repo.repo,
                                  commit_sha: run.head_sha,
                              });
                          pullRequests = associated.data.filter(
                              (pullRequest) =>
                                  pullRequest.base.repo.full_name ===
                                  context.payload.repository.full_name,
                          );
                      }
                      if (pullRequests.length !== 1) {
                          core.warning("No unique pull request is associated with this benchmark run.");
                          return;
                      }
                      const pullRequest = await github.rest.pulls.get({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: pullRequests[0].number,
                      });
                      const benchmarkArtifacts = artifacts.filter((artifact) =>
                          artifact.name.startsWith("pr-benchmark-"),
                      );
                      const expectedNames = new Set([
                          "pr-benchmark-comparison",
                          `pr-benchmark-baseline-${pullRequest.data.base.sha}`,
                      ]);
                      const selected = benchmarkArtifacts.filter(
                          (artifact) => expectedNames.has(artifact.name) && !artifact.expired,
                      );
                      const safe =
                          selected.length === expectedNames.size &&
                          benchmarkArtifacts.length === expectedNames.size &&
                          new Set(selected.map((artifact) => artifact.name)).size ===
                              expectedNames.size &&
                          selected.every(
                              (artifact) =>
                                  artifact.size_in_bytes > 0 &&
                                  artifact.size_in_bytes <= 65536,
                          );
                      core.setOutput("artifact_safe", safe ? "true" : "false");
                      core.setOutput("pull_number", String(pullRequest.data.number));
                      core.setOutput("base_sha", pullRequest.data.base.sha);
                      core.setOutput("head_sha", pullRequest.data.head.sha);
                      if (pullRequest.data.head.sha !== run.head_sha) {
                          core.warning("The benchmark run is stale for the current pull-request head.");
                          core.setOutput("artifact_safe", "false");
                          core.setOutput("current", "false");
                      } else {
                          core.setOutput("current", "true");
                      }
            - name: Download benchmark results as untrusted data
              if: ${{ steps.comparison.outputs.artifact_safe == 'true' }}
              id: download
              continue-on-error: true
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ github.event.workflow_run.id }}
                  name: pr-benchmark-comparison
                  path: benchmark-results
            - name: Create or update the benchmark comment
              if: ${{ steps.comparison.outputs.current == 'true' }}
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  ARTIFACT_SAFE: ${{ steps.comparison.outputs.artifact_safe }}
                  BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
                  HEAD_SHA: ${{ steps.comparison.outputs.head_sha }}
                  PULL_NUMBER: ${{ steps.comparison.outputs.pull_number }}
              with:
                  script: |
                      const fs = require("node:fs");

                      const marker = "<!-- markdown-core-pr-benchmark -->";
                      const origins = new Set(["head", "main-build", "fallback-build"]);
                      const exactKeys = [
                          "binaryBytes",
                          "bytes",
                          "medianNs",
                          "memoryKiB",
                          "origin",
                          "repeats",
                          "runtime",
                          "schema",
                          "sourceSha",
                          "warmup",
                          "workload",
                          "workloadVersion",
                      ];

                      function readMetric(file, expectedSha) {
                          if (!fs.existsSync(file) || fs.statSync(file).size > 32768) return null;
                          try {
                              const metric = JSON.parse(fs.readFileSync(file, "utf8"));
                              const valid =
                                  metric &&
                                  Object.keys(metric).sort().join("\n") === exactKeys.join("\n") &&
                                  metric.schema === 1 &&
                                  metric.sourceSha === expectedSha &&
                                  origins.has(metric.origin) &&
                                  metric.runtime === "c" &&
                                  metric.workload === "representative_large" &&
                                  metric.workloadVersion === 1 &&
                                  Number.isSafeInteger(metric.bytes) &&
                                  metric.bytes > 0 &&
                                  Number.isSafeInteger(metric.warmup) &&
                                  metric.warmup >= 0 &&
                                  Number.isSafeInteger(metric.repeats) &&
                                  metric.repeats > 0 &&
                                  Number.isSafeInteger(metric.medianNs) &&
                                  metric.medianNs > 0 &&
                                  Number.isSafeInteger(metric.memoryKiB) &&
                                  metric.memoryKiB >= 0 &&
                                  Number.isSafeInteger(metric.binaryBytes) &&
                                  metric.binaryBytes > 0 &&
                                  !("boundary" in metric);
                              return valid ? metric : null;
                          } catch {
                              return null;
                          }
                      }

                      function percent(current, baseline) {
                          if (!Number.isFinite(baseline) || baseline === 0) return "n/a";
                          const value = ((current - baseline) / baseline) * 100;
                          return `${value > 0 ? "+" : ""}${value.toFixed(1)}%`;
                      }

                      const issueNumber = Number(process.env.PULL_NUMBER);
                      if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
                          core.notice("No validated pull request number is available.");
                          return;
                      }
                      const artifactSafe = process.env.ARTIFACT_SAFE === "true";
                      const head = artifactSafe
                          ? readMetric("benchmark-results/head.json", process.env.HEAD_SHA)
                          : null;
                      const base = artifactSafe
                          ? readMetric("benchmark-results/base.json", process.env.BASE_SHA)
                          : null;
                      const lines = [marker, "## PR benchmark", ""];
                      if (head && base) {
                          const contractMatches =
                              head.runtime === base.runtime &&
                              head.workload === base.workload &&
                              head.workloadVersion === base.workloadVersion &&
                              head.bytes === base.bytes &&
                              head.warmup === base.warmup &&
                              head.repeats === base.repeats;
                          const baselineLabel =
                              base.origin === "main-build"
                                  ? "published exact-base baseline"
                                  : "published exact-base fallback baseline";
                          lines.push(
                              `Baseline: ${baselineLabel} at \`${process.env.BASE_SHA.slice(0, 12)}\`.`,
                              "",
                              "| Runtime | Workload | Input | Head median | Base median | Perf diff | Head RSS | Base RSS | RSS diff |",
                              "| --- | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |",
                              `| C | ${head.workload} (v${head.workloadVersion}) | ${head.bytes.toLocaleString("en-US")} B | ${(head.medianNs / 1e6).toFixed(3)} ms | ${(base.medianNs / 1e6).toFixed(3)} ms | ${contractMatches ? percent(head.medianNs, base.medianNs) : "n/a"} | ${head.memoryKiB.toLocaleString("en-US")} KiB | ${base.memoryKiB.toLocaleString("en-US")} KiB | ${contractMatches ? percent(head.memoryKiB, base.memoryKiB) : "n/a"} |`,
                              "",
                              "### Binary size",
                              "",
                              "| Artifact | Head | Base | Diff |",
                              "| --- | ---: | ---: | ---: |",
                              `| libmarkdown-core | ${head.binaryBytes.toLocaleString("en-US")} B | ${base.binaryBytes.toLocaleString("en-US")} B | ${contractMatches ? percent(head.binaryBytes, base.binaryBytes) : "n/a"} |`,
                              "",
                          );
                      } else {
                          lines.push(
                              "No validated comparison was produced. Inspect the benchmark run.",
                              "",
                          );
                      }
                      lines.push(
                          `[Benchmark run](${context.payload.workflow_run.html_url})`,
                          "",
                          "Hosted-runner timing and RSS are informational observations, not merge gates or regression thresholds. Binary size is deterministic only for identical toolchain inputs.",
                      );

                      const body = lines.join("\n");
                      const comments = await github.paginate(github.rest.issues.listComments, {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: issueNumber,
                          per_page: 100,
                      });
                      const previous = comments.find(
                          (comment) =>
                              comment.user?.type === "Bot" && comment.body?.includes(marker),
                      );
                      if (previous) {
                          await github.rest.issues.updateComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              comment_id: previous.id,
                              body,
                          });
                      } else {
                          await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: issueNumber,
                              body,
                          });
                      }
