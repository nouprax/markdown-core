name: CI

on:
    workflow_call:
    pull_request:
    push:
        branches:
            - main
    merge_group:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    # Keep default-branch push, pull-request, merge-queue, and reusable release
    # runs in separate lanes. GitHub can leave a cancelled runner in teardown
    # indefinitely; cross-event SHA deduplication could then prevent another
    # control-plane run from starting. Newer runs still replace older runs for
    # the same PR or ref.
    group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    health-check-repository:
        name: Health Check - Repository
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  run_install: false
                  version: 11.7.0
            - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
              with:
                  cache: gradle
                  distribution: temurin
                  java-version: 26
            - name: Install JavaScript dependencies
              run: pnpm install --frozen-lockfile
            - name: Check prepared repository environment
              run: scripts/init-environment.sh --check node java wrappers dependencies
            - name: Check cross-platform contracts
              run: pnpm check:contracts
            - name: Audit test layout and public surface
              run: |
                  pnpm audit:repository:clean
                  pnpm audit:ci
                  pnpm audit:tests
                  pnpm audit:surface
                  pnpm audit:extension-special-chars
                  pnpm audit:extension-attach-order
                  pnpm audit:source-lists
                  pnpm audit:ast-projections

    health-check-c:
        name: Health Check - C
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  run_install: false
                  version: 11.7.0
            - name: Install C health-check dependencies
              run: |
                  python3 -m pip install clang-format==22.1.8
                  pnpm install --frozen-lockfile
            - name: Check C and CMake formatting
              run: |
                  pnpm format:c:check
                  pnpm format:cmake:check
            - name: Lint C
              run: pnpm lint:c

    health-check-es:
        name: Health Check - ES
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  run_install: false
                  version: 11.7.0
            - name: Install ES health-check dependencies
              run: pnpm install --frozen-lockfile
            - name: Check ES formatting
              run: pnpm format:es:check
            - name: Lint ES
              run: pnpm lint:es

    health-check-kotlin:
        name: Health Check - Kotlin
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  run_install: false
                  version: 11.7.0
            - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
              with:
                  cache: gradle
                  distribution: temurin
                  java-version: 26
            - name: Install Kotlin health-check dependencies
              run: pnpm install --frozen-lockfile
            - name: Check Kotlin formatting and lint
              run: pnpm format:kotlin:check
            - name: Load Gradle model
              run: pnpm check:gradle-model

    package-audit:
        name: Build Test - Repository / Package Contents
        needs: builds-ready
        runs-on: ubuntu-latest
        # Apt against Azure Ubuntu mirrors has stalled after Ign: until GitHub's
        # 6h hosted-runner cancellation, which skipped every Test / benchmark job.
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  run_install: false
                  version: 11.7.0
            - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
              with:
                  cache: gradle
                  distribution: temurin
                  java-version: 26
            - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
            - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
              with:
                  version: 4.0.23
            - name: Install package-audit dependencies
              run: |
                  if ! command -v pkg-config >/dev/null 2>&1; then
                      sudo timeout --kill-after=10s 90s apt-get update
                      sudo timeout --kill-after=10s 90s env DEBIAN_FRONTEND=noninteractive \
                          apt-get install --yes pkg-config
                  fi
                  sdkmanager "platforms;android-36" "cmake;3.22.1" "ndk;28.2.13676358"
                  pnpm install --frozen-lockfile
            - name: Check prepared package-audit environment
              run: scripts/init-environment.sh --check core node java wrappers android emscripten dependencies
            - name: Audit installed and published package contents
              run: pnpm audit:packages

    health-check-swift:
        name: Health Check - Swift
        runs-on: macos-26
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: "26.6"
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  run_install: false
                  version: 11.7.0
            - name: Check prepared Swift environment
              run: scripts/init-environment.sh --check node wrappers swift
            - name: Check Swift formatting
              run: scripts/format-swift.sh --check
            - name: Lint Swift
              run: scripts/lint-swift.sh

    health-checks-ready:
        name: Health Checks - Ready
        needs:
            - health-check-repository
            - health-check-c
            - health-check-es
            - health-check-kotlin
            - health-check-swift
        runs-on: ubuntu-latest
        steps:
            - name: Release checked source to build producers
              run: echo "Every repository and platform health check passed."

    c-product-build:
        name: Build - C / ${{ matrix.label }}
        needs: health-checks-ready
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      label: Linux · Clang · Shared
                      compiler: clang
                      cc: clang
                      cxx: clang++
                      shared: "ON"
                      variant: linux-clang-shared
                    - os: ubuntu-latest
                      label: Linux · GCC · Static
                      compiler: gcc
                      cc: gcc
                      cxx: g++
                      shared: "OFF"
                      variant: linux-gcc-static
                    - os: macos-latest
                      label: macOS · Clang · Shared
                      compiler: clang
                      cc: clang
                      cxx: clang++
                      shared: "ON"
                      variant: macos-clang-shared
        env:
            CC: ${{ matrix.cc }}
            CXX: ${{ matrix.cxx }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Build immutable C product artifact
              run: |
                  scripts/build-c-product-artifact.sh \
                      "${{ matrix.variant }}" \
                      "${{ matrix.shared }}" \
                      build/ci-artifacts/c-product
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: c-product-${{ matrix.variant }}-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 7
                  path: build/ci-artifacts/c-product

    c-product-build-windows:
        name: Build - C / Windows · Static
        needs: health-checks-ready
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Build immutable C product artifact
              shell: bash
              run: scripts/build-c-product-artifact.sh windows-static OFF build/ci-artifacts/c-product Release
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: c-product-windows-static-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 7
                  path: build/ci-artifacts/c-product

    es-product-build:
        name: Build - ES / WASM Package
        needs: health-checks-ready
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  run_install: false
                  version: 11.7.0
            - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
              with:
                  version: 4.0.23
            - name: Install ES build dependencies
              run: pnpm install --frozen-lockfile
            - name: Build immutable ES product artifact
              run: scripts/build-es-product-artifact.sh
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: es-product-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 7
                  path: build/ci-artifacts/es-product

    kotlin-product-build:
        name: Build - Kotlin / ${{ matrix.label }}
        needs: health-checks-ready
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      label: Linux · Release Publications
                      mode: linux-release
                      artifact-label: linux-release
                    - os: macos-26
                      label: macOS · Native Publications
                      mode: macos-native
                      artifact-label: macos-native
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
              with:
                  cache: gradle
                  distribution: temurin
                  java-version: 26
            - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
              if: matrix.mode == 'linux-release'
            - name: Install Android build dependencies
              if: matrix.mode == 'linux-release'
              run: sdkmanager "platforms;android-36" "cmake;3.22.1" "ndk;28.2.13676358"
            - name: Build immutable Kotlin product artifact
              run: |
                  scripts/build-kotlin-product-artifact.sh \
                      "${{ matrix.mode }}" \
                      "build/ci-artifacts/kotlin-product-${{ matrix.artifact-label }}"
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: kotlin-product-${{ matrix.artifact-label }}-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 7
                  path: build/ci-artifacts/kotlin-product-${{ matrix.artifact-label }}

    swift-product-build:
        name: Build - Swift / Product
        needs: health-checks-ready
        runs-on: macos-26
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: "26.6"
            - name: Build immutable Swift product artifact
              run: scripts/build-swift-product-artifact.sh
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: swift-product-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 7
                  path: build/ci-artifacts/swift-product

    swift-test-build:
        name: Build Test - Swift / Test Products
        needs: builds-ready
        runs-on: macos-26
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: "26.6"
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: swift-product-${{ github.sha }}
                  path: build/ci-artifacts/swift-product
            - name: Restore Swift product tree
              run: |
                  cd build/ci-artifacts/swift-product
                  shasum -a 256 -c SHA256SUMS
                  tar -xzf swift-product-tree.tar.gz -C ../../..
            - name: Build immutable macOS and iOS test products
              run: scripts/build-swift-test-artifact.sh
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: swift-test-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 7
                  path: build/ci-artifacts/swift

    swift-test:
        name: Test - Swift / ${{ matrix.label }}
        needs: build-tests-ready
        runs-on: macos-26
        timeout-minutes: 12
        strategy:
            fail-fast: false
            matrix:
                include:
                    - suite: macos-correctness
                      label: macOS · Correctness
                    - suite: macos-conformance
                      label: macOS · Conformance
                    - suite: ios-correctness
                      label: iOS · Correctness
                    - suite: ios-conformance
                      label: iOS · Conformance
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: "26.6"
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: swift-test-${{ github.sha }}
                  path: build/ci-artifacts/swift
            - name: Run Swift suite without building
              run: scripts/run-swift-test-artifact.sh build/ci-artifacts/swift "${{ matrix.suite }}"

    swift-deployment-contract:
        name: Build - Swift / ${{ matrix.label }}
        needs: health-checks-ready
        runs-on: macos-26
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: iOS
                      version: "18.0"
                      label: iOS 18
                    - platform: iOS
                      version: "26.0"
                      label: iOS 26
                    - platform: macOS
                      version: "15.0"
                      label: macOS 15
                    - platform: macOS
                      version: "26.0"
                      label: macOS 26
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: "26.6"
            - name: Build declared deployment target
              env:
                  PLATFORM: ${{ matrix.platform }}
                  VERSION: ${{ matrix.version }}
              run: scripts/build-swift-deployment.sh "$PLATFORM" "$VERSION"

    kotlin-test-build:
        name: Build Test - Kotlin / ${{ matrix.label }}
        needs: builds-ready
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: linuxX64
                      target-id: linux-x64
                      label: Linux x64 · Host Tests
                    - os: macos-26
                      target: macosArm64
                      target-id: macos-arm64
                      label: macOS arm64 · Host Tests
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
              with:
                  cache: gradle
                  distribution: temurin
                  java-version: 26
            - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
            - name: Install Android build dependencies
              if: matrix.os == 'ubuntu-latest'
              run: sdkmanager "platforms;android-36" "cmake;3.22.1" "ndk;28.2.13676358"
            - name: Build immutable Kotlin test products
              run: scripts/build-kotlin-host-test-artifact.sh "${{ matrix.target }}"
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: kotlin-host-${{ matrix.target-id }}-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 7
                  path: build/ci-artifacts/kotlin-${{ matrix.target }}

    kotlin-test:
        name: Test - Kotlin / ${{ matrix.label }}
        needs: build-tests-ready
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      artifact-target: linux-x64
                      artifact-dir: linuxX64
                      platform: linux-x64
                      suite: correctness
                      label: Linux x64 · Correctness
                    - os: ubuntu-latest
                      artifact-target: linux-x64
                      artifact-dir: linuxX64
                      platform: linux-x64
                      suite: conformance
                      label: Linux x64 · Conformance
                    - os: macos-26
                      artifact-target: macos-arm64
                      artifact-dir: macosArm64
                      platform: macos-arm64
                      suite: correctness
                      label: macOS arm64 · Correctness
                    - os: macos-26
                      artifact-target: macos-arm64
                      artifact-dir: macosArm64
                      platform: macos-arm64
                      suite: conformance
                      label: macOS arm64 · Conformance
                    - os: ubuntu-latest
                      artifact-target: linux-x64
                      artifact-dir: linuxX64
                      platform: jvm
                      suite: correctness
                      label: JVM · Correctness
                    - os: ubuntu-latest
                      artifact-target: linux-x64
                      artifact-dir: linuxX64
                      platform: jvm
                      suite: conformance
                      label: JVM · Conformance
                    - os: ubuntu-latest
                      artifact-target: linux-x64
                      artifact-dir: linuxX64
                      platform: android-host
                      suite: correctness
                      label: Android Host · Correctness
                    - os: ubuntu-latest
                      artifact-target: linux-x64
                      artifact-dir: linuxX64
                      platform: android-host
                      suite: conformance
                      label: Android Host · Conformance
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
              if: matrix.platform == 'jvm' || matrix.platform == 'android-host'
              with:
                  distribution: temurin
                  java-version: 26
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: kotlin-host-${{ matrix.artifact-target }}-${{ github.sha }}
                  path: build/ci-artifacts/kotlin-${{ matrix.artifact-dir }}
            - name: Run Kotlin suite without building
              run: |
                  scripts/run-kotlin-host-test-artifact.sh \
                      "build/ci-artifacts/kotlin-${{ matrix.artifact-dir }}" \
                      "${{ matrix.platform }}" \
                      "${{ matrix.suite }}"

    kotlin-consumers:
        name: Build Test - Kotlin / Consumers
        needs: builds-ready
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
              with:
                  cache: gradle
                  distribution: temurin
                  # Two JDKs: the last listed becomes the default JAVA_HOME
                  # for Gradle and AGP, while 17 is exported as
                  # JAVA_HOME_17_X64 so the Maven consumer exercises the
                  # published artifact on the advertised JVM 17 floor.
                  java-version: |
                      17
                      26
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  run_install: false
                  version: 11.7.0
            - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
            - name: Install Android build dependencies
              run: sdkmanager "platforms;android-36" "cmake;3.22.1" "ndk;28.2.13676358"
            - name: Verify Kotlin publication consumers
              env:
                  MARKDOWN_CORE_MAVEN_CONSUMER_JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
              run: pnpm check:kotlin-consumers

    kotlin-android-test-build:
        name: Build Test - Kotlin / Android x86_64 · Instrumentation APK
        needs: builds-ready
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
              with:
                  cache: gradle
                  distribution: temurin
                  java-version: 26
            - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
            - name: Install Android build dependencies
              run: sdkmanager "platforms;android-36" "cmake;3.22.1" "ndk;28.2.13676358"
            - name: Build immutable Android instrumentation artifact
              run: scripts/build-kotlin-android-test-artifact.sh
            - name: Upload Android instrumentation artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: kotlin-android-x86_64-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 7
                  path: build/ci-artifacts/kotlin-android-x86_64

    kotlin-android-test:
        # Each leaf receives the same immutable APK and owns a fresh emulator
        # lifecycle per attempt. No Gradle, JVM, NDK, CMake, publication,
        # managed device snapshot, or other test suite runs on these
        # consumers. The emulator and system image are pinned by cache key:
        # Google revises system-image packages in place under the same path
        # (the 16 KB image is on its seventh revision), so an uncached
        # sdkmanager install makes runs non-reproducible, and the ~1.7 GB
        # download itself has corrupted (digest-mismatch); bump the -r
        # suffix deliberately to take a newer revision.
        name: Test - Kotlin / Android · ${{ matrix.label }}
        needs: build-tests-ready
        runs-on: ubuntu-24.04
        # Two full attempts must fit: each is bounded by three minutes of adb
        # wait, six of boot, and six of instrumentation, so a first-attempt
        # hang still leaves the fresh-AVD retry room to finish.
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - page-size: 4k
                      page-size-label: 4 KB
                      system-image: google_apis
                      suite: correctness
                      label: 4 KB · x86_64 · Correctness
                    - page-size: 16k
                      page-size-label: 16 KB
                      system-image: google_apis_ps16k
                      suite: correctness
                      label: 16 KB · x86_64 · Correctness
                    - page-size: 4k
                      page-size-label: 4 KB
                      system-image: google_apis
                      suite: conformance
                      label: 4 KB · x86_64 · Conformance
                    - page-size: 16k
                      page-size-label: 16 KB
                      system-image: google_apis_ps16k
                      suite: conformance
                      label: 16 KB · x86_64 · Conformance
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
            - name: Restore the pinned emulator and system image
              id: emulator-cache
              uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      ${{ env.ANDROID_HOME }}/emulator
                      ${{ env.ANDROID_HOME }}/system-images/android-36/${{ matrix.system-image }}
                  key: android-emulator-api36-${{ matrix.system-image }}-x86_64-r1
            - name: Install one Android runtime image
              if: steps.emulator-cache.outputs.cache-hit != 'true'
              run: |
                  sdkmanager \
                      "emulator" \
                      "system-images;android-36;${{ matrix.system-image }};x86_64"
            # Saved before the tests run, not in a post step: the combined
            # cache action only saves on job success, so a cold cache plus
            # one flaky failure would re-download moving bytes on every
            # rerun — exactly what the pin exists to prevent. Sibling legs
            # sharing an image race to save once; the loser's "cache
            # already exists" is harmless.
            - name: Save the pinned emulator and system image
              if: steps.emulator-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      ${{ env.ANDROID_HOME }}/emulator
                      ${{ env.ANDROID_HOME }}/system-images/android-36/${{ matrix.system-image }}
                  key: android-emulator-api36-${{ matrix.system-image }}-x86_64-r1
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: Verify runner architecture and emulator acceleration
              run: |
                  test "${{ runner.arch }}" = "X64"
                  test -c /dev/kvm
                  test -r /dev/kvm
                  test -w /dev/kvm
                  "$ANDROID_HOME/emulator/emulator" -accel-check
            - name: Download immutable Android instrumentation artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: kotlin-android-x86_64-${{ github.sha }}
                  path: build/ci-artifacts/kotlin-android-x86_64
            - name: Run Android ${{ matrix.suite }} without building
              # One bounded retry with a fresh AVD absorbs transient
              # emulator-stack crashes; a real regression still fails both
              # attempts.
              run: |
                  for attempt in 1 2; do
                      if scripts/run-kotlin-android-test-artifact.sh \
                          build/ci-artifacts/kotlin-android-x86_64 \
                          "${{ matrix.suite }}" \
                          "${{ matrix.page-size }}"; then
                          exit 0
                      fi
                      echo "::warning::Android ${{ matrix.label }} attempt ${attempt} failed"
                  done
                  exit 1
            - name: Upload Android test failure evidence
              # A job-timeout kill cancels the run step rather than failing
              # it; the evidence must survive that path too.
              if: failure() || cancelled()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: android-${{ matrix.page-size }}-${{ matrix.suite }}-failure-${{ github.run_attempt }}
                  if-no-files-found: warn
                  retention-days: 14
                  path: ${{ runner.temp }}/android-test-${{ matrix.page-size }}-${{ matrix.suite }}

    es-test-build:
        name: Build Test - ES / Test Bundle
        needs: builds-ready
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  run_install: false
                  version: 11.7.0
            - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
              with:
                  version: 4.0.23
            - name: Install JavaScript dependencies
              run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: es-product-${{ github.sha }}
                  path: build/ci-artifacts/es-product
            - name: Build immutable ES test artifact
              run: scripts/build-es-test-artifact.sh build/ci-artifacts/es build/ci-artifacts/es-product
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: es-test-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 7
                  path: build/ci-artifacts/es

    es-test:
        name: Test - ES / ${{ matrix.label }}
        needs: build-tests-ready
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - suite: node-correctness
                      label: Node · Correctness
                    - suite: browser-correctness
                      label: Browser · Correctness
                    - suite: node-conformance
                      label: Node · Conformance
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  run_install: false
                  version: 11.7.0
            - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
              id: setup-chrome
              if: matrix.suite == 'browser-correctness'
            - name: Install test-runner dependencies
              run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: es-test-${{ github.sha }}
                  path: build/ci-artifacts/es
            - name: Run ES suite without building
              run: scripts/run-es-test-artifact.sh build/ci-artifacts/es "${{ matrix.suite }}"
              env:
                  CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}

    c-test-build:
        name: Build Test - C / ${{ matrix.label }}
        needs: builds-ready
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      label: Linux · Clang · Shared
                      compiler: clang
                      cc: clang
                      cxx: clang++
                      shared: "ON"
                      product-variant: linux-clang-shared
                    - os: ubuntu-latest
                      label: Linux · GCC · Static
                      compiler: gcc
                      cc: gcc
                      cxx: g++
                      shared: "OFF"
                      product-variant: linux-gcc-static
                    - os: macos-latest
                      label: macOS · Clang · Shared
                      compiler: clang
                      cc: clang
                      cxx: clang++
                      shared: "ON"
                      product-variant: macos-clang-shared
        env:
            CC: ${{ matrix.cc }}
            CXX: ${{ matrix.cxx }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: c-product-${{ matrix.product-variant }}-${{ github.sha }}
                  path: build/ci-artifacts/c-product
            - name: Restore C product tree
              run: |
                  cd build/ci-artifacts/c-product
                  if command -v sha256sum >/dev/null 2>&1; then
                      sha256sum --check SHA256SUMS
                  else
                      shasum -a 256 -c SHA256SUMS
                  fi
                  tar -xzf c-product-tree.tar.gz -C ../../..
            - name: Configure
              run: scripts/build-c-test-artifact.sh default "${{ matrix.shared }}" build/ci-artifacts/c
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: c-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.shared }}-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 7
                  path: build/ci-artifacts/c

    c-test-build-windows:
        name: Build Test - C / Windows · Static
        needs: builds-ready
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: c-product-windows-static-${{ github.sha }}
                  path: build/ci-artifacts/c-product
            - name: Restore C product tree
              shell: bash
              run: |
                  cd build/ci-artifacts/c-product
                  sha256sum --check SHA256SUMS
                  tar -xzf c-product-tree.tar.gz -C ../../..
            - name: Build immutable C test artifact
              shell: bash
              run: scripts/build-c-test-artifact.sh default OFF build/ci-artifacts/c Release
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: c-windows-static-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 7
                  path: build/ci-artifacts/c

    c-sanitizer-test-build:
        name: Build Test - C Sanitizer / ${{ matrix.label }}
        needs: builds-ready
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - sanitizer: asan
                      label: ASan
                    - sanitizer: ubsan
                      label: UBSan
                    - sanitizer: tsan
                      label: TSan
        env: { CC: clang, CXX: clang++ }
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Build immutable sanitizer test artifact
              run: scripts/build-c-test-artifact.sh "${{ matrix.sanitizer }}" - build/ci-artifacts/c
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: c-${{ matrix.sanitizer }}-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 7
                  path: build/ci-artifacts/c

    c-test:
        name: Test - C / ${{ matrix.label }}
        needs: build-tests-ready
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      compiler: clang
                      shared: "ON"
                      suite: correctness
                      label: Linux · Clang · Shared · Correctness
                    - os: ubuntu-latest
                      compiler: clang
                      shared: "ON"
                      suite: conformance
                      label: Linux · Clang · Shared · Conformance
                    - os: ubuntu-latest
                      compiler: gcc
                      shared: "OFF"
                      suite: correctness
                      label: Linux · GCC · Static · Correctness
                    - os: ubuntu-latest
                      compiler: gcc
                      shared: "OFF"
                      suite: conformance
                      label: Linux · GCC · Static · Conformance
                    - os: macos-latest
                      compiler: clang
                      shared: "ON"
                      suite: correctness
                      label: macOS · Clang · Shared · Correctness
                    - os: macos-latest
                      compiler: clang
                      shared: "ON"
                      suite: conformance
                      label: macOS · Clang · Shared · Conformance
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: c-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.shared }}-${{ github.sha }}
                  path: build/ci-artifacts/c
            - name: Run CTest suite without building
              run: scripts/run-c-test-artifact.sh build/ci-artifacts/c "${{ matrix.suite }}"

    c-test-windows:
        name: Test - C / ${{ matrix.label }}
        needs: build-tests-ready
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - suite: correctness
                      label: Windows · Static · Correctness
                    - suite: conformance
                      label: Windows · Static · Conformance
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: c-windows-static-${{ github.sha }}
                  path: build/ci-artifacts/c
            - name: Run CTest suite without building
              shell: bash
              run: scripts/run-c-test-artifact.sh build/ci-artifacts/c "${{ matrix.suite }}" Release

    # ThreadSanitizer gates the frozen concurrency contract. All sanitizer
    # consumers execute a prebuilt instrumented tree on a fresh runner.
    c-sanitizer-test:
        name: Test - C Sanitizer / ${{ matrix.label }}
        needs: build-tests-ready
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - sanitizer: asan
                      preset: correctness-asan
                      label: ASan
                    - sanitizer: ubsan
                      preset: correctness-ubsan
                      label: UBSan
                    - sanitizer: tsan
                      preset: correctness-tsan
                      label: TSan
        env:
            ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
            UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
            TSAN_OPTIONS: halt_on_error=1:abort_on_error=1
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: c-${{ matrix.sanitizer }}-${{ github.sha }}
                  path: build/ci-artifacts/c
            - name: Run sanitizer suite without building
              run: scripts/run-c-test-artifact.sh build/ci-artifacts/c "${{ matrix.preset }}"

    benchmark-c:
        name: Test - C / Linux · Benchmark
        needs: build-tests-ready
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: c-ubuntu-latest-clang-ON-${{ github.sha }}
                  path: build/ci-artifacts/c
            - name: Run C benchmark suite without building
              # The explicit bash shell adds -o pipefail; the default run
              # shell would let tee's zero status mask a benchmark failure.
              shell: bash
              run: |
                  mkdir -p build/pr-metrics-logs
                  scripts/run-c-test-artifact.sh build/ci-artifacts/c benchmark \
                      2>&1 | tee build/pr-metrics-logs/c.log
            - name: Collect informational C metrics
              if: ${{ always() }}
              continue-on-error: true
              env:
                  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              run: node scripts/collect-pr-metrics.mjs --platform linux --logs build/pr-metrics-logs --output build/pr-metrics/c-linux.json
            - name: Upload informational C metrics
              if: ${{ always() }}
              continue-on-error: true
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: pr-metrics-c-linux
                  path: build/pr-metrics/c-linux.json
                  if-no-files-found: warn
                  retention-days: 14

    benchmark-kotlin:
        name: Test - Kotlin / JVM · Benchmark
        needs: build-tests-ready
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
              with:
                  distribution: temurin
                  java-version: 26
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: kotlin-host-linux-x64-${{ github.sha }}
