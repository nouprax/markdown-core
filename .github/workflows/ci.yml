              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: pr-metrics-swift-macos
                  path: build/pr-metrics/macos.json
                  if-no-files-found: warn
                  retention-days: 14

    benchmarks-ready:
        name: Benchmarks - Ready
        if: ${{ always() }}
        needs: [benchmark-c, benchmark-kotlin, benchmark-es, benchmark-swift]
        runs-on: ubuntu-latest
        steps:
            - name: Require every platform benchmark
              env:
                  C: ${{ needs.benchmark-c.result }}
                  KOTLIN: ${{ needs.benchmark-kotlin.result }}
                  ES: ${{ needs.benchmark-es.result }}
                  SWIFT: ${{ needs.benchmark-swift.result }}
              run: |
                  for result in "$C" "$KOTLIN" "$ES" "$SWIFT"; do
                      test "$result" = success
                  done

    builds-ready:
        name: Builds - Ready
        needs:
            - c-product-build
            - c-product-build-windows
            - es-product-build
            - kotlin-product-build
            - swift-product-build
            - swift-deployment-contract
        runs-on: ubuntu-latest
        steps:
            - name: Release immutable build artifacts to build tests
              run: echo "Every platform build artifact is ready."

    build-tests-ready:
        name: Build Tests - Ready
        needs:
            - package-audit
            - kotlin-consumers
            - swift-test-build
            - kotlin-test-build
            - kotlin-android-test-build
            - es-test-build
            - c-test-build
            - c-test-build-windows
            - c-sanitizer-test-build
        runs-on: ubuntu-latest
        steps:
            - name: Release build-tested artifacts to parallel test consumers
              run: echo "Every platform build test passed."

    tests-ready:
        name: Tests - Ready
        if: ${{ always() }}
        needs:
            - swift-test
            - kotlin-test
            - kotlin-android-test
            - es-test
            - c-test
            - c-test-windows
            - c-sanitizer-test
        runs-on: ubuntu-latest
        steps:
            - name: Require every platform test
              env:
                  SWIFT_TEST: ${{ needs.swift-test.result }}
                  KOTLIN_TEST: ${{ needs.kotlin-test.result }}
                  KOTLIN_ANDROID_TEST: ${{ needs.kotlin-android-test.result }}
                  ES_TEST: ${{ needs.es-test.result }}
                  C_TEST: ${{ needs.c-test.result }}
                  C_TEST_WINDOWS: ${{ needs.c-test-windows.result }}
                  C_SANITIZER_TEST: ${{ needs.c-sanitizer-test.result }}
              run: |
                  for result in \
                      "$SWIFT_TEST" \
                      "$KOTLIN_TEST" \
                      "$KOTLIN_ANDROID_TEST" \
                      "$ES_TEST" \
                      "$C_TEST" \
                      "$C_TEST_WINDOWS" \
                      "$C_SANITIZER_TEST"
                  do
                      if [ "$result" != success ]; then
                          echo "A required test dependency concluded: $result" >&2
                          exit 1
                      fi
                  done

    # Coverage is its own layer, not a test consumer: every producer must
    # compile an instrumented tree, which the test layer forbids by contract.
    # It sits beside Tests and Benchmarks as a third parallel aggregate.
    #
    # swift-macos runs on macOS because llvm-cov must match the clang
    # that produced the profile, and the Xcode toolchain ships the pair; the
    # recorded ledger and measured-file floors come from that same toolchain.
    coverage:
        name: Coverage - ${{ matrix.label }}
        needs: health-checks-ready
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: swift-macos
                      label: Swift / macOS
                      os: macos-latest
                      needs-java: false
                      needs-emsdk: false
                    - platform: kotlin-jvm
                      label: Kotlin / JVM
                      os: ubuntu-latest
                      needs-java: true
                      needs-emsdk: false
                    - platform: es-node
                      label: ES / Node
                      os: ubuntu-latest
                      needs-java: false
                      needs-emsdk: true
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  run_install: false
                  version: 11.7.0
            - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
              if: ${{ matrix.needs-java }}
              with:
                  cache: gradle
                  distribution: temurin
                  java-version: 26
            - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
              if: ${{ matrix.needs-emsdk }}
              with:
                  version: 4.0.23
            - name: Install coverage dependencies
              run: pnpm install --frozen-lockfile
            - name: Enforce the coverage gate
              run: pnpm "coverage:${{ matrix.platform }}"

    coverage-ready:
        name: Coverage - Ready
        if: ${{ always() }}
        needs:
            - coverage
        runs-on: ubuntu-latest
        steps:
            - name: Require every platform coverage gate
              env:
                  COVERAGE: ${{ needs.coverage.result }}
              run: |
                  if [ "$COVERAGE" != success ]; then
                      echo "A required coverage dependency concluded: $COVERAGE" >&2
                      exit 1
                  fi

    # The two gates that check Markdown Core's semantics against authorities
    # outside itself: cmark-gfm for the base language, and the remark ecosystem
    # for the constructs cmark-gfm does not implement. Both build this parser,
    # so they sit beside Coverage as their own layer rather than in the Test
    # layer, which forbids compilers.
    upstream-parity:
        name: External parity
        needs: health-checks-ready
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  run_install: false
                  version: 11.7.0
            - name: Install parity dependencies
              run: pnpm install --frozen-lockfile
            - name: Build this parser
              run: pnpm build:c
            - name: Build the pinned upstream parser
              run: scripts/init-environment.sh --install upstream-cmark
            - name: Compare against upstream cmark-gfm
              run: pnpm check:upstream-parity
            - name: Compare against the remark ecosystem
              run: pnpm check:mdast-parity
            # The position oracles. They live here because one of the three
            # needs the pinned upstream parser this job already builds, and
            # because all three are ratchets over registered rows: they fail on
            # a row appearing AND on a row clearing, so a fix that moves one
            # without recording it fails in CI rather than in review.
            - name: Check inline positions against upstream cmark-gfm
              run: pnpm audit:inline-sourcepos
            - name: Check scope containment and sibling overlap
              run: pnpm audit:scope-containment
            - name: Check that every position is a place
              run: pnpm audit:position-places
            # Registered RED until Step 9a: it fails when a row stops
            # reproducing, not only when one appears.
            - name: Check that reference resolution is order-independent
              run: pnpm audit:reference-order
            # Bounded and seeded, so a CI failure replays locally with the seed
            # it prints. The mdast oracle is deliberately not fuzzed here yet:
            # it still reports divergences of mixed root cause that have not
            # been triaged, and a gate nobody can act on is noise.
            - name: Fuzz against upstream cmark-gfm
              run: pnpm fuzz:parity -- --oracle upstream --iterations 400 --seed 1
            - name: Fuzz against the remark ecosystem
              run: pnpm fuzz:parity -- --oracle mdast --iterations 400 --seed 1

    required-gates:
        # Push runs use an independent, non-required context. PR and
        # merge-queue runs alone own the name referenced by the ruleset.
        name: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'Required gates' || 'Development branch gates' }}
        if: ${{ always() }}
        needs:
            - tests-ready
            - benchmarks-ready
            - coverage-ready
            - upstream-parity
        runs-on: ubuntu-latest
        steps:
            - name: Require the complete test, benchmark, coverage, and parity layers
              env:
                  TESTS_READY: ${{ needs.tests-ready.result }}
                  BENCHMARKS_READY: ${{ needs.benchmarks-ready.result }}
                  COVERAGE_READY: ${{ needs.coverage-ready.result }}
                  UPSTREAM_PARITY: ${{ needs.upstream-parity.result }}
              run: |
                  for result in "$TESTS_READY" "$BENCHMARKS_READY" "$COVERAGE_READY" "$UPSTREAM_PARITY"; do
                      test "$result" = success
                  done
