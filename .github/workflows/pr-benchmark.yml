name: PR Benchmark

on:
    pull_request:
        types: [opened, reopened, synchronize]

permissions:
    actions: read
    contents: read

concurrency:
    group: pr-benchmark-${{ github.event.pull_request.number }}
    cancel-in-progress: true

env:
    CC: clang
    CXX: clang++

jobs:
    changes:
        uses: ./.github/workflows/changes.yml
        permissions:
            actions: read
            contents: read

    compare:
        needs: changes
        name: Measure - C base and head on one runner
        if: ${{ needs.changes.outputs.required == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out the exact PR base
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ github.event.pull_request.base.repo.full_name }}
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: sources/base
                  persist-credentials: false
            - name: Check out the exact PR head
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.sha }}
                  path: sources/head
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.8.1
            - name: Clean-build both revisions and measure paired samples
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  node sources/head/scripts/pr-benchmark.mjs \
                      --base-source sources/base --base-sha "$BASE_SHA" \
                      --head-source sources/head --head-sha "$HEAD_SHA" \
                      --output build/pr-benchmark
            - name: Upload the paired measurement as untrusted data
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: pr-benchmark-comparison-${{ github.run_attempt }}
                  path: build/pr-benchmark/comparison.json
                  if-no-files-found: error
                  retention-days: 14
            - name: Upload build provenance
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: benchmark-build-provenance-${{ github.run_attempt }}
                  path: |
                      build/pr-benchmark/*-build.log
                      build/pr-benchmark/*-CMakeCache.txt
                      build/pr-benchmark/*-compile_commands.json
                      build/pr-benchmark/summary.md
                  if-no-files-found: ignore
                  retention-days: 14
