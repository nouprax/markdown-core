name: PR Benchmark

on:
    pull_request:
        types: [opened, reopened, synchronize]
    push:
        branches:
            - main

permissions:
    actions: read
    contents: read

concurrency:
    group: pr-benchmark-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    CC: clang
    CXX: clang++

jobs:
    publish-baseline:
        name: Publish - C benchmark baseline
        if: ${{ github.event_name == 'push' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.8.1
            - name: Build the baseline parser
              run: |
                  cmake --preset benchmark
                  cmake --build --preset benchmark --target bench_runner --parallel 2
            - name: Measure the baseline parser
              shell: bash
              run: |
                  mkdir -p build/pr-benchmark
                  build/benchmark/packages/markdown-core/tests/bench_runner \
                      --workload binding_baseline \
                      --samples packages/markdown-core/benchmarks/samples \
                      --warmup 2 \
                      --repeats 9 \
                      2>&1 | tee build/pr-benchmark/baseline.log
                  node scripts/pr-benchmark-result.mjs collect \
                      --log build/pr-benchmark/baseline.log \
                      --build-dir build/benchmark \
                      --output build/pr-benchmark/baseline.json \
                      --source-sha "$GITHUB_SHA" \
                      --origin main-build
            - name: Upload the exact-commit baseline
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: pr-benchmark-baseline-${{ github.sha }}
                  path: build/pr-benchmark/baseline.json
                  if-no-files-found: error
                  retention-days: 30

    compare:
        name: Compare - C parser against exact PR base
        if: ${{ github.event_name == 'pull_request' }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out the PR head
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.sha }}
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.8.1
            - name: Find an exact-base benchmark artifact
              id: published-baseline
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const base = context.payload.pull_request.base;
                      const artifactName = `pr-benchmark-baseline-${base.sha}`;
                      const artifacts = await github.paginate(
                          github.rest.actions.listArtifactsForRepo,
                          {
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              name: artifactName,
                              per_page: 100,
                          },
                      );
                      const candidates = artifacts.filter(
                          (artifact) =>
                              artifact.name === artifactName &&
                              !artifact.expired &&
                              artifact.size_in_bytes > 0 &&
                              artifact.size_in_bytes <= 65536,
                      );
                      for (const artifact of candidates) {
                          const response = await github.rest.actions.getWorkflowRun({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              run_id: artifact.workflow_run.id,
                          });
                          const run = response.data;
                          const trustedMain =
                              run.event === "push" &&
                              run.head_sha === base.sha &&
                              run.head_branch === base.ref;
                          const samePullRequest =
                              run.event === "pull_request" &&
                              run.pull_requests?.some(
                                  (pullRequest) =>
                                      pullRequest.number === context.payload.pull_request.number,
                              );
                          if (
                              run.path === ".github/workflows/pr-benchmark.yml" &&
                              run.status === "completed" &&
                              (trustedMain || samePullRequest)
                          ) {
                              core.setOutput("available", "true");
                              core.setOutput("run_id", String(run.id));
                              core.setOutput("artifact_name", artifactName);
                              core.setOutput("source", run.event);
                              return;
                          }
                      }
                      core.notice(`No published benchmark exists for exact base ${base.sha}; the base will be built and published.`);
                      core.setOutput("available", "false");
            - name: Download the published exact-base benchmark
              if: ${{ steps.published-baseline.outputs.available == 'true' }}
              id: download-baseline
              continue-on-error: true
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ steps.published-baseline.outputs.run_id }}
                  name: ${{ steps.published-baseline.outputs.artifact_name }}
                  path: build/pr-benchmark/downloaded
            - name: Validate the published baseline
              id: baseline
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  mkdir -p build/pr-benchmark
                  downloaded=build/pr-benchmark/downloaded/baseline.json
                  if test -f "$downloaded" && \
                      node scripts/pr-benchmark-result.mjs validate \
                          --input "$downloaded" --source-sha "$BASE_SHA"; then
                      cp "$downloaded" build/pr-benchmark/base.json
                      echo "usable=true" >>"$GITHUB_OUTPUT"
                  else
                      echo "usable=false" >>"$GITHUB_OUTPUT"
                  fi
            - name: Check out the exact PR base for fallback
              if: ${{ steps.baseline.outputs.usable != 'true' }}
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ github.event.pull_request.base.repo.full_name }}
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: baseline-source
            - name: Build and measure the exact PR base fallback
              if: ${{ steps.baseline.outputs.usable != 'true' }}
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              shell: bash
              run: |
                  cmake -S baseline-source -B baseline-source/build/benchmark \
                      -DCMAKE_BUILD_TYPE=Release \
                      -DMARKDOWN_CORE_BENCHMARKS=ON
                  cmake --build baseline-source/build/benchmark --target bench_runner --parallel 2
                  baseline-source/build/benchmark/packages/markdown-core/tests/bench_runner \
                      --workload binding_baseline \
                      --samples baseline-source/packages/markdown-core/benchmarks/samples \
                      --warmup 2 \
                      --repeats 9 \
                      2>&1 | tee build/pr-benchmark/base.log
                  node scripts/pr-benchmark-result.mjs collect \
                      --log build/pr-benchmark/base.log \
                      --build-dir baseline-source/build/benchmark \
                      --output build/pr-benchmark/base.json \
                      --source-sha "$BASE_SHA" \
                      --origin fallback-build
            - name: Publish the exact-base benchmark for later PR runs
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: pr-benchmark-baseline-${{ github.event.pull_request.base.sha }}
                  path: build/pr-benchmark/base.json
                  if-no-files-found: error
                  retention-days: 30
            - name: Build and measure the PR head
              env:
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              shell: bash
              run: |
                  cmake --preset benchmark
                  cmake --build --preset benchmark --target bench_runner --parallel 2
                  build/benchmark/packages/markdown-core/tests/bench_runner \
                      --workload binding_baseline \
                      --samples packages/markdown-core/benchmarks/samples \
                      --warmup 2 \
                      --repeats 9 \
                      2>&1 | tee build/pr-benchmark/head.log
                  node scripts/pr-benchmark-result.mjs collect \
                      --log build/pr-benchmark/head.log \
                      --build-dir build/benchmark \
                      --output build/pr-benchmark/head.json \
                      --source-sha "$HEAD_SHA" \
                      --origin head
            - name: Upload the self-contained comparison
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: pr-benchmark-comparison
                  path: |
                      build/pr-benchmark/base.json
                      build/pr-benchmark/head.json
                  if-no-files-found: error
                  retention-days: 14
