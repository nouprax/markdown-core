name: PR Benchmark

on:
    pull_request:
        types: [opened, reopened, synchronize]
    push:
        branches:
            - main

permissions:
    actions: read
    contents: read

concurrency:
    group: pr-benchmark-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    CC: clang
    CXX: clang++

jobs:
    publish-baseline:
        name: Publish - C benchmark baseline
        if: ${{ github.event_name == 'push' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.8.1
            - name: Build the baseline parser
              run: |
                  cmake --preset benchmark
                  cmake --build --preset benchmark --target bench_runner --parallel 2
            - name: Measure the baseline parser
              shell: bash
              run: |
                  mkdir -p build/pr-benchmark
                  build/benchmark/packages/markdown-core/tests/bench_runner \
                      --workload binding_baseline \
                      --samples packages/markdown-core/benchmarks/samples \
                      --warmup 2 \
                      --repeats 9 \
                      2>&1 | tee build/pr-benchmark/baseline.log
                  node scripts/pr-benchmark-result.mjs collect \
                      --log build/pr-benchmark/baseline.log \
                      --build-dir build/benchmark \
                      --output build/pr-benchmark/baseline.json \
                      --source-sha "$GITHUB_SHA" \
                      --origin main-build
            - name: Upload the exact-commit baseline
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: pr-benchmark-baseline-${{ github.sha }}
                  path: build/pr-benchmark/baseline.json
                  if-no-files-found: error
                  retention-days: 30

    measure-head:
        name: Measure - C parser at PR head
        if: ${{ github.event_name == 'pull_request' }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out the PR head
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.sha }}
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.8.1
            - name: Build and measure the PR head
              env:
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              shell: bash
              run: |
                  cmake --preset benchmark
                  cmake --build --preset benchmark --target bench_runner --parallel 2
                  mkdir -p build/pr-benchmark
                  build/benchmark/packages/markdown-core/tests/bench_runner \
                      --workload binding_baseline \
                      --samples packages/markdown-core/benchmarks/samples \
                      --warmup 2 \
                      --repeats 9 \
                      2>&1 | tee build/pr-benchmark/head.log
                  node scripts/pr-benchmark-result.mjs collect \
                      --log build/pr-benchmark/head.log \
                      --build-dir build/benchmark \
                      --output build/pr-benchmark/head.json \
                      --source-sha "$HEAD_SHA" \
                      --origin head
            - name: Upload the untrusted head measurement
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: pr-benchmark-head
                  path: build/pr-benchmark/head.json
                  if-no-files-found: error
                  retention-days: 14
