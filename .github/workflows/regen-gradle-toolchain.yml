# TEMPORARY: regenerates the Gradle wrapper, lockfiles and dependency
# verification metadata for the AGP/Gradle upgrade on a runner that can reach
# Google Maven, then commits the result back to this branch. Removed before
# the pull request is opened.
name: Regenerate Gradle toolchain

on:
    push:
        branches: [claude/project-thread-2t9o6g]
        paths: [.github/workflows/regen-gradle-toolchain.yml]

permissions:
    contents: write

jobs:
    regen:
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        env:
            GRADLE_TARGET: 9.9.2
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26.12.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  run_install: false
                  version: 11.28.7
            - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  distribution: temurin
                  java-version: |
                      17
                      26
            - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
              with:
                  packages: platform-tools
            - run: sdkmanager "platforms;android-36" "cmake;3.22.1" "ndk;28.2.13676358"
            - run: pnpm install --frozen-lockfile
            - name: Pick the latest stable AGP from Google Maven
              id: agp
              run: |
                  curl -fsSL https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml \
                      | tr '<' '\n' | sed -n 's/^version>//p' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                      | sort -V | tail -5 | tee agp-versions.txt
                  agp=$(tail -1 agp-versions.txt)
                  echo "version=$agp" >>"$GITHUB_OUTPUT"
                  echo "::notice::Latest stable AGP: $agp"
                  old=$(sed -n 's/^agp = "\(.*\)"/\1/p' gradle/libs.versions.toml)
                  sed -i "s/^agp = \"$old\"/agp = \"$agp\"/" gradle/libs.versions.toml
                  sed -i "s/id(\"com.android.application\") version \"$old\"/id(\"com.android.application\") version \"$agp\"/" \
                      packages/kotlin-markdown-core/consumers/android/build.gradle.kts
                  sed -i "s/on AGP $old until/on AGP $agp until/" packages/kotlin-markdown-core/build.gradle.kts
                  rm agp-versions.txt
            - name: Verify the Gradle distribution signature
              id: dist
              run: |
                  base=https://services.gradle.org/distributions/gradle-$GRADLE_TARGET-bin.zip
                  curl -fsSL -o dist.zip "$base"
                  curl -fsSL -o dist.zip.asc "$base.asc"
                  sha=$(sha256sum dist.zip | cut -d' ' -f1)
                  test "$sha" = "$(curl -fsSL "$base.sha256")"
                  gpg --batch --keyserver hkps://keys.openpgp.org --recv-keys F3FF33E96F18AA62DD580F9651FBF517CE6D6B80 || true
                  gpg --batch --status-fd 1 --verify dist.zip.asc dist.zip | tee gpg.txt
                  fpr=$(sed -n 's/^\[GNUPG:\] VALIDSIG [0-9A-F]* [^ ]* [^ ]* [^ ]* [^ ]* [^ ]* [^ ]* [^ ]* [^ ]* \([0-9A-F]*\)$/\1/p' gpg.txt)
                  [ -n "$fpr" ] || fpr=$(sed -n 's/^\[GNUPG:\] VALIDSIG \([0-9A-F]*\) .*/\1/p' gpg.txt)
                  echo "::notice::Gradle $GRADLE_TARGET sha256 $sha signed by $fpr"
                  echo "sha=$sha" >>"$GITHUB_OUTPUT"
                  echo "fpr=$fpr" >>"$GITHUB_OUTPUT"
                  rm -f dist.zip dist.zip.asc gpg.txt
            - name: Update the Gradle wrapper
              env:
                  JAVA_HOME: ${{ env.JAVA_HOME_26_X64 }}
              run: |
                  ./gradlew --dependency-verification off wrapper \
                      --gradle-version "$GRADLE_TARGET" \
                      --gradle-distribution-sha256-sum "${{ steps.dist.outputs.sha }}"
                  # A second run lets the new Gradle write its own wrapper JAR.
                  ./gradlew --dependency-verification off wrapper \
                      --gradle-version "$GRADLE_TARGET" \
                      --gradle-distribution-sha256-sum "${{ steps.dist.outputs.sha }}"
                  ./gradlew --version
            - name: Update reviewed toolchain constants
              run: |
                  old=$(sed -n 's/^GRADLE_VERSION=//p' scripts/tooling/setup-environment.sh)
                  jar=$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
                  fpr="${{ steps.dist.outputs.fpr }}"
                  oldfpr=$(sed -n 's/^GRADLE_SIGNING_KEY_FINGERPRINT=//p' scripts/tooling/setup-environment.sh)
                  sed -i \
                      -e "s/^GRADLE_VERSION=.*/GRADLE_VERSION=$GRADLE_TARGET/" \
                      -e "s/^GRADLE_DISTRIBUTION_SHA256=.*/GRADLE_DISTRIBUTION_SHA256=${{ steps.dist.outputs.sha }}/" \
                      -e "s/^GRADLE_WRAPPER_JAR_SHA256=.*/GRADLE_WRAPPER_JAR_SHA256=$jar/" \
                      scripts/tooling/setup-environment.sh
                  if [ "$fpr" = "$oldfpr" ]; then
                      sed -i "s/<trusted-key id=\"$oldfpr\" group=\"gradle\" name=\"gradle\" version=\"$old\"\/>/<trusted-key id=\"$oldfpr\" group=\"gradle\" name=\"gradle\" version=\"$GRADLE_TARGET\"\/>/" \
                          gradle/verification-metadata.xml
                  else
                      echo "::warning::Gradle signing key changed from $oldfpr to $fpr; left for review"
                  fi
                  grep -rl "gradle-$old-bin.zip\|Gradle $old" --exclude-dir=.git --exclude-dir=node_modules . || true
            - name: Regenerate lockfiles and dependency verification
              env:
                  JAVA_HOME: ${{ env.JAVA_HOME_26_X64 }}
              run: |
                  # Key servers are needed once to export the new signing keys.
                  cp gradle/verification-metadata.xml verification-metadata.before
                  sed -i 's#<key-servers enabled="false"/>#<key-servers enabled="true"/>#' gradle/verification-metadata.xml
                  ./gradlew --console=plain --continue \
                      --write-verification-metadata pgp,sha256 --export-keys --write-locks \
                      :dependencies :buildEnvironment \
                      :packages:kotlin-markdown-core:dependencies \
                      :packages:kotlin-markdown-core:buildEnvironment \
                      :packages:kotlin-markdown-core:android-runtime:dependencies \
                      :packages:kotlin-markdown-core:contracts:list-naming:dependencies \
                      ktlintCheck \
                      :packages:kotlin-markdown-core:contracts:list-naming:compileKotlin \
                      :packages:kotlin-markdown-core:stageJvmTestArtifact \
                      :packages:kotlin-markdown-core:stageAndroidHostTestArtifact \
                      :packages:kotlin-markdown-core:linkDebugTestLinuxX64 \
                      :packages:kotlin-markdown-core:packageAndroidDeviceTest \
                      :packages:kotlin-markdown-core:checkKotlinAbi \
                      :packages:kotlin-markdown-core:publishKotlinToMavenLocal \
                      -PmarkdownCore.android.abis=x86_64 || echo "::warning::some regeneration tasks failed"
                  sed -i 's#<key-servers enabled="true"/>#<key-servers enabled="false"/>#' gradle/verification-metadata.xml
                  rm -f verification-metadata.before gradle/verification-metadata.dryrun.xml
            - name: Commit the regenerated files
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git status --short
                  git diff --stat
                  git add -A gradle gradlew gradlew.bat gradle.lockfile settings-gradle.lockfile \
                      packages scripts/tooling/setup-environment.sh
                  git commit -m "Regenerate Gradle wrapper, locks and verification for AGP ${{ steps.agp.outputs.version }} and Gradle $GRADLE_TARGET"
                  git push origin HEAD:claude/project-thread-2t9o6g
