name: CodeQL

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    merge_group:
    schedule:
        - cron: "45 14 * * 3"

jobs:
    changes:
        uses: ./.github/workflows/changes.yml
        permissions:
            actions: read
            contents: read

    analyze:
        needs: changes
        if: ${{ needs.changes.outputs.required == 'true' }}
        name: Security Scan - ${{ matrix.label }}
        runs-on: ${{ matrix.os }}
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: c-cpp
                      label: C and C++
                      build-mode: manual
                      os: ubuntu-latest
                    - language: java-kotlin
                      label: Java and Kotlin
                      build-mode: manual
                      os: ubuntu-latest
                    - language: javascript-typescript
                      label: JavaScript and TypeScript
                      build-mode: none
                      os: ubuntu-latest
                    - language: swift
                      label: Swift
                      build-mode: manual
                      os: macos-26
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up JDK 26
              if: matrix.language == 'java-kotlin'
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  cache: gradle
                  distribution: temurin
                  java-version: 26
            - name: Select Xcode 26.6
              if: matrix.language == 'swift'
              uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: "26.6"
            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  build-mode: ${{ matrix.build-mode }}
                  languages: ${{ matrix.language }}
            - name: Build C/C++ product
              if: matrix.language == 'c-cpp'
              run: |
                  cmake -S . -B build/codeql -DMARKDOWN_CORE_TESTS=OFF
                  cmake --build build/codeql --parallel
            - name: Build Kotlin product
              if: matrix.language == 'java-kotlin'
              run: scripts/tooling/run-gradle.sh --no-build-cache --rerun-tasks :packages:kotlin-markdown-core:compileKotlinJvm
            - name: Build Swift product
              if: matrix.language == 'swift'
              run: swift build --target MarkdownCore
            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  category: /language:${{ matrix.language }}

    codeql-gate:
        name: CodeQL gate
        if: ${{ always() }}
        needs: [changes, analyze]
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Report required validation result
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  NEEDS: ${{ toJSON(needs) }}
              with:
                  script: |
                      const { requireGate } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/shared/ci-gate.mjs`);
                      core.info(requireGate(JSON.parse(process.env.NEEDS)));
