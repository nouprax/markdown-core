name: Attribute Benchmark

# Informational grammar comparison. Its setup, measurement and upload failures
# remain visible here without entering CI's source-budget or release gates.
on:
    pull_request:
    push:
        branches:
            - main
    merge_group:
    workflow_dispatch:

permissions:
    actions: read
    contents: read

concurrency:
    group: attribute-benchmark-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        uses: ./.github/workflows/changes.yml
        permissions:
            actions: read
            contents: read

    attributes:
        needs: changes
        name: Measure - the attribute grammar against lexbor
        if: ${{ needs.changes.outputs.required == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.8.1
            - name: Install callgrind
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends --yes valgrind
            - name: Build the pinned lexbor baseline
              run: scripts/init-environment.sh --install oracle-lexbor
            # A separate job from the stage measurement, for the same reason it
            # is a separate driver: the two baselines cannot be given the same
            # bytes, so this compares one grammar against one grammar rather
            # than two document parsers on one corpus.
            - name: Measure the attribute grammar
              run: node scripts/benchmark-attributes.mjs
            - name: Publish the report to the run summary
              if: ${{ always() }}
              run: |
                  test -f build/benchmark-attributes/attributes.md \
                      && cat build/benchmark-attributes/attributes.md >>"$GITHUB_STEP_SUMMARY"
            - name: Upload the report and the raw dumps
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: attribute-benchmark-${{ github.sha }}
                  path: |
                      build/benchmark-attributes/attributes.md
                      build/benchmark-attributes/attributes.json
                      build/benchmark-attributes/callgrind
                      build/benchmark-attributes/input
                  if-no-files-found: error
                  retention-days: 30
